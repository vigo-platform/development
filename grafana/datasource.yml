apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    orgId: 1
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: true

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    orgId: 1
    url: http://alertmanager:9093
    access: proxy
    editable: true
    jsonData:
      implementation: prometheus
