
services:
  redis:
    image: redis:7
    container_name: redis
    env_file:
      - path: ./redis/.env
        format: raw
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    labels:
      logging: true
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - path: ./postgres/.env
        format: raw
    ports:
      - "5432:5432"
    labels:
      logging: true
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    image: logtaha/vigo-auth-service:1.0.3
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_PORT:-8080}:8080"
    labels:
      logging: true
    env_file:
      - path: ./auth/.env
        format: raw
    environment:
      USER_GRPC_HOST: ${USER_GRPC_HOST:-user}
    volumes:
      - type: bind
        source: ${AUTH_KEYS_DIR:-./auth/.keys}
        target: /app/.keys
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  user:
    image: logtaha/vigo-user-service:1.0.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${USER_PORT:-8081}:8081"
    labels:
      logging: true
    env_file:
      - path: ./user/.env
        format: raw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    env_file:
      - path: ./postgres-exporter/.env
        format: raw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    env_file:
      - path: ./node-exporter/.env
        format: raw
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    env_file:
      - path: ./alertmanager/.env
        format: raw
    labels:
      logging: true
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        : "$${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in alertmanager/.env}"
        : "$${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in alertmanager/.env}"
        : "$${TELEGRAM_MESSAGE_THREAD_ID:?Set TELEGRAM_MESSAGE_THREAD_ID in alertmanager/.env}"
        sed -e "s|__TELEGRAM_BOT_TOKEN__|$$TELEGRAM_BOT_TOKEN|g" \
            -e "s|__TELEGRAM_CHAT_ID__|$$TELEGRAM_CHAT_ID|g" \
            -e "s|__TELEGRAM_MESSAGE_THREAD_ID__|$$TELEGRAM_MESSAGE_THREAD_ID|g" \
            /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    env_file:
      - path: ./prometheus/.env
        format: raw
    restart: unless-stopped
    secrets:
      - auth_metrics_password
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - path: ./grafana/.env
        format: raw
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

  # ── Elasticsearch ──────────────────────────────────────────

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: elasticsearch
    restart: unless-stopped
    env_file:
      - path: ./elasticsearch/.env
        format: raw
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kibana ─────────────────────────────────────────────────

  kibana:
    image: kibana:8.15.3
    container_name: kibana
    restart: unless-stopped
    env_file:
      - path: ./kibana/.env
        format: raw
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - app-network

  # Import the dashboard and its dependencies after Kibana is ready.

  kibana-setup:
    image: python:3.12-alpine
    restart: "no"
    env_file:
      - path: ./kibana-setup/.env
        format: raw
    volumes:
      - ./dashboards/kibana:/dashboards:ro
    command: ["python", "-u", "/dashboards/import_dashboard.py"]
    depends_on:
      - kibana
    networks:
      - app-network

  # ── Vector (Log Collector & Shipper) ───────────────────────

  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    user: root
    env_file:
      - path: ./vector/.env
        format: raw
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "127.0.0.1:8686:8686"
    volumes:
      - ./vector/vector.yml:/etc/vector/vector.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - app-network
    command: ["--config", "/etc/vector/vector.yml"]

networks:
  app-network:
    driver: bridge

secrets:
  auth_metrics_password:
    file: ./prometheus/secrets/auth_metrics_password

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  elasticsearch_data:
  vector_data:
